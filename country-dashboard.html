<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Country Atlas</title>
<style>
  :root {
    --bg: #0b1016; --panel: #121a23; --panel2: #18232f; --line: #263544;
    --fg: #e8eff5; --muted: #8fa3b3; --accent: #f2b84b; --accent2: #5ec2d6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: baseline; justify-content: space-between;
    padding: 14px 20px 0; }
  h1 { margin: 0; font-size: 18px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }
  #status { color: var(--muted); font-size: 12px; }
  #status.warn { color: var(--accent); }

  #facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; padding: 14px 20px; }
  .fact { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
  .fact .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
  .fact .v { font-size: clamp(28px, 4.2vw, 46px); font-weight: 700; line-height: 1.1; margin-top: 4px;
    font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .fact .u { color: var(--muted); font-size: 13px; }
  .fact.empty .v { color: #3a4b5b; }

  main { display: grid; grid-template-columns: minmax(300px, 1.1fr) minmax(300px, 1fr); gap: 12px; padding: 0 20px 24px; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  #globeWrap { position: relative; background: radial-gradient(circle at 50% 40%, #0f1d2b, #070b10 70%);
    border: 1px solid var(--line); border-radius: 10px; min-height: 420px; height: min(72vh, 680px); overflow: hidden; }
  #globe { position: absolute; inset: 0; }
  #search { position: absolute; top: 10px; left: 10px; right: 10px; max-width: 280px; z-index: 2; }
  #search input { width: 100%; background: rgba(11,16,22,.85); border: 1px solid var(--line); color: var(--fg);
    border-radius: 8px; padding: 9px 12px; font: inherit; outline: none; }
  #search input:focus-visible { border-color: var(--accent2); }
  #matches { list-style: none; margin: 4px 0 0; padding: 0; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; max-height: 220px; overflow: auto; display: none; }
  #matches li { padding: 7px 12px; cursor: pointer; }
  #matches li:hover, #matches li:focus-visible { background: var(--panel2); outline: none; }
  #hint { position: absolute; bottom: 10px; left: 12px; color: var(--muted); font-size: 12px; z-index: 2; pointer-events: none; }

  #tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; align-content: start; }
  .tile { text-align: left; background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; font: inherit; cursor: pointer; min-width: 0; display: flex; flex-direction: column; gap: 6px;
    transition: border-color .15s, transform .15s; }
  .tile:hover, .tile:focus-visible { border-color: var(--accent); transform: translateY(-2px); outline: none; }
  .tile .k { color: var(--accent2); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
  .tile .big { font-size: 20px; font-weight: 650; overflow-wrap: anywhere; }
  .tile .sub { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  .tile .more { margin-top: auto; color: var(--accent); font-size: 12px; }
  .tile.flag img { width: 100%; max-height: 110px; object-fit: contain; border-radius: 4px; background: #0003; }
  .placeholder { grid-column: 1 / -1; color: var(--muted); padding: 28px 8px; text-align: center;
    border: 1px dashed var(--line); border-radius: 10px; }

  dialog { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 12px;
    width: min(640px, calc(100vw - 32px)); max-height: 86vh; padding: 0; }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  .dh { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .dh h2 { margin: 0; font-size: 17px; }
  .dh button { background: transparent; border: 1px solid var(--line); color: var(--fg); border-radius: 6px;
    padding: 4px 10px; font: inherit; cursor: pointer; }
  .db { padding: 16px 18px 20px; overflow: auto; max-height: calc(86vh - 60px); }
  .db h3 { margin: 18px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--accent2); }
  .db h3:first-child { margin-top: 0; }
  .db p { margin: 4px 0; }
  .db table { border-collapse: collapse; width: 100%; }
  .db td { padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
  .db td:first-child { color: var(--muted); width: 38%; }
  .db img.flagbig { max-width: 100%; border-radius: 6px; border: 1px solid var(--line); }
  .db pre { background: #070b10; padding: 12px; border-radius: 8px; overflow: auto; font-size: 12px; max-height: 50vh; }
  .bar { height: 8px; background: var(--panel2); border-radius: 4px; overflow: hidden; margin: 6px 0; }
  .bar i { display: block; height: 100%; background: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Country Atlas</h1>
  <div id="status">Loading globe…</div>
</header>

<section id="facts" aria-label="Key facts"></section>

<main>
  <div id="globeWrap">
    <div id="search">
      <input id="q" type="search" placeholder="Find a country" aria-label="Find a country" autocomplete="off">
      <ul id="matches"></ul>
    </div>
    <div id="globe"></div>
    <div id="hint">Drag to rotate, scroll to zoom, click a country</div>
  </div>
  <div id="tiles"><div class="placeholder">Click a country on the globe to see its capital, cities, population, area, currency, languages and flag.</div></div>
</main>

<dialog id="dlg"><div class="dh"><h2 id="dt"></h2><button id="dx" type="button">Close</button></div><div class="db" id="dbody"></div></dialog>

<script src="https://cdn.jsdelivr.net/npm/globe.gl@2.27.2/dist/globe.gl.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script>
(function () {
  "use strict";

  // ===== Configuration ====================================================
  // Calls go to the local server (server.py), which adds the API key and
  // forwards them. The key never appears in this page.
  var API_URL = "/api/v5";
  var FALLBACK_URL = "/api/v3/alpha/"; // public v3.1 data, used if the v5 call fails
  // =======================================================================

  var $ = function (id) { return document.getElementById(id); };
  var fmt = new Intl.NumberFormat("en-US");
  var compact = new Intl.NumberFormat("en-US", { notation: "compact", maximumFractionDigits: 2 });
  var statusEl = $("status"), cache = {}, current = null, features = [], hoverD = null, selD = null, world;

  function setStatus(t, warn) { statusEl.textContent = t; statusEl.className = warn ? "warn" : ""; }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

  // ---- Key facts row ----------------------------------------------------
  function renderFacts(c) {
    var items = c ? [
      ["Population", c.population != null ? compact.format(c.population) : "n/a", c.population != null ? fmt.format(c.population) + " people" : ""],
      ["Area", c.area != null ? compact.format(c.area) : "n/a", "km²"],
      ["Density", c.population && c.area ? fmt.format(Math.round(c.population / c.area)) : "n/a", "people per km²"],
      ["Languages", String(c.languages.length || "n/a"), c.languages.slice(0, 2).map(function (l) { return l.name; }).join(", ")]
    ] : [["Population", "—", "Select a country"], ["Area", "—", ""], ["Density", "—", ""], ["Languages", "—", ""]];
    $("facts").innerHTML = items.map(function (it) {
      return '<div class="fact' + (c ? "" : " empty") + '"><div class="k">' + it[0] + '</div><div class="v">' + esc(it[1]) +
        '</div><div class="u">' + esc(it[2]) + '</div></div>';
    }).join("");
  }

  // ---- Normalize whatever shape the API returns -------------------------
  function dig(o, path) { return path.split(".").reduce(function (a, k) { return a == null ? a : a[k]; }, o); }
  function first(o, paths) { for (var i = 0; i < paths.length; i++) { var v = dig(o, paths[i]); if (v != null && v !== "") return v; } return null; }
  function listify(v, nameKeys) {
    if (v == null) return [];
    if (typeof v === "string") return [{ name: v }];
    if (!Array.isArray(v) && typeof v === "object" && (v.name != null || v.common != null)) v = [v];
    if (Array.isArray(v)) return v.map(function (x) {
      if (typeof x === "string") return { name: x };
      var n = first(x, nameKeys || ["name", "label"]); return { name: n || JSON.stringify(x), raw: x };
    });
    return Object.keys(v).map(function (k) {
      var x = v[k]; if (typeof x === "string") return { code: k, name: x };
      return { code: k, name: first(x, nameKeys || ["name", "label"]) || k, symbol: x.symbol, raw: x };
    });
  }
  // Breadth-first search for the first value stored under any of the given keys.
  function deep(o, keys) {
    var q = [o], n = 0;
    while (q.length && n++ < 4000) {
      var cur = q.shift();
      if (!cur || typeof cur !== "object") continue;
      if (!Array.isArray(cur)) for (var i = 0; i < keys.length; i++) {
        if (cur[keys[i]] != null && cur[keys[i]] !== "") return cur[keys[i]];
      }
      var ks = Object.keys(cur);
      for (var j = 0; j < ks.length; j++) {
        if (ks[j] === "translations" || ks[j] === "native" || ks[j] === "alternates") continue;
        if (cur[ks[j]] && typeof cur[ks[j]] === "object") q.push(cur[ks[j]]);
      }
    }
    return null;
  }
  function num(v) {
    if (v == null) return null;
    if (typeof v === "number") return v;
    if (typeof v === "string" && !isNaN(+v.replace(/,/g, ""))) return +v.replace(/,/g, "");
    if (typeof v === "object") { var ks = Object.keys(v); for (var i = 0; i < ks.length; i++) { var x = num(v[ks[i]]); if (x != null) return x; } }
    return null;
  }
  function normalize(r) {
    var c = normalize0(r), d = function (k) { return deep(r, k); };
    c.population = num(c.population); if (c.population == null) c.population = num(d(["population", "totalPopulation"]));
    c.area = num(c.area); if (c.area == null) c.area = num(d(["area", "areaKm2", "area_km2", "totalArea", "total_area"]));
    if (!c.official) c.official = first(r, ["names.official"]);
    if (!c.capitals.length) c.capitals = listify(d(["capital", "capitals", "capitalCity", "capital_city"]));
    if (!c.cities.length) c.cities = listify(d(["cities", "majorCities", "largestCities", "major_cities"]));
    if (!c.currencies.length) c.currencies = listify(d(["currencies", "currency"]));
    if (!c.languages.length) c.languages = listify(d(["languages", "language"]));
    if (!c.region) c.region = d(["region", "continent"]);
    if (!c.subregion) c.subregion = d(["subregion"]);
    if (!c.code) c.code = d(["cca2", "iso2", "alpha2", "iso_3166_1_alpha_2"]);
    if (!c.flagUrl || !/^https?:/.test(c.flagUrl)) {
      var f = d(["flags", "flag", "flagUrl"]);
      if (f && typeof f === "object") f = f.svg || f.png || f.url || f.href || deep(f, ["svg", "png", "url"]);
      if (typeof f === "string" && /^https?:/.test(f)) c.flagUrl = f;
    }
    return c;
  }
  function normalize0(r) {
    var name = first(r, ["name.common", "name", "names.common"]);
    var cities = first(r, ["cities", "majorCities", "major_cities"]);
    return {
      raw: r,
      name: typeof name === "object" ? first(name, ["common", "official"]) : name,
      official: first(r, ["name.official", "officialName", "official_name"]),
      code: first(r, ["cca2", "iso2", "alpha2", "code"]),
      region: first(r, ["region"]), subregion: first(r, ["subregion"]),
      population: first(r, ["population", "stats.population"]),
      area: first(r, ["area", "areaKm2", "area_km2", "stats.area"]),
      capitals: listify(first(r, ["capital", "capitals", "capitalCity"])),
      capitalLatLng: first(r, ["capitalInfo.latlng"]),
      cities: listify(cities),
      currencies: listify(first(r, ["currencies", "currency"])),
      languages: listify(first(r, ["languages", "language"])),
      flagUrl: first(r, ["flags.svg", "flags.png", "flag.svg", "flag.png", "flagUrl", "flag_url", "flag"]),
      flagAlt: first(r, ["flags.alt"]),
      flagEmoji: first(r, ["flag"]),
      coatUrl: first(r, ["coatOfArms.svg", "coatOfArms.png"]),
      timezones: first(r, ["timezones"]) || [], borders: first(r, ["borders"]) || [],
      tld: first(r, ["tld"]) || [], latlng: first(r, ["latlng"]),
      landlocked: first(r, ["landlocked"]), independent: first(r, ["independent"]),
      unMember: first(r, ["unMember"]), startOfWeek: first(r, ["startOfWeek"]), drive: first(r, ["car.side"]),
      calling: (function () { var i = first(r, ["idd.root"]); var s = first(r, ["idd.suffixes"]); return i ? i + ((s && s.length === 1) ? s[0] : "") : null; })()
    };
  }
  function pickRecord(data, f) {
    var arr = Array.isArray(data) ? data : (data && (data.objects || data.results || data.data || data.countries)) || [data];
    if (!Array.isArray(arr)) arr = [arr];
    arr = arr.filter(Boolean);
    var id = String(f.id || "").padStart(3, "0");
    var m = arr.filter(function (x) { return String(first(x, ["ccn3", "numeric", "isoNumeric"]) || "").padStart(3, "0") === id; })[0];
    if (!m) m = arr.filter(function (x) {
      var n = String(first(x, ["names.common", "name.common", "name"]) || "").toLowerCase(); return n === f.properties.name.toLowerCase(); })[0];
    if (!m) m = arr.filter(function (x) {
      var n = String(first(x, ["names.common", "name.common", "name"]) || "").toLowerCase(), t = f.properties.name.toLowerCase();
      return n && (n.indexOf(t) > -1 || t.indexOf(n) > -1); })[0];
    return m || arr[0];
  }

  // ---- Fetching ----------------------------------------------------------
  function getCountry(f) {
    var key = f.id + "|" + f.properties.name;
    if (cache[key]) return Promise.resolve(cache[key]);
    var q = API_URL + "?q=" + encodeURIComponent(f.properties.name);
    return fetch(q).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status); return r.json();
    }).then(function (j) {
      var rec = pickRecord(j, f); if (!rec) throw new Error("empty result");
      var c = normalize(rec);
      if (!c.name && c.population == null) throw new Error("v5 record fields not recognized");
      c.source = "api.restcountries.com v5"; return c;
    }).catch(function (err1) {
      var id = String(f.id || "").padStart(3, "0");
      return fetch(FALLBACK_URL + id).then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status); return r.json();
      }).then(function (j) {
        var c = normalize(pickRecord(j, f)); c.source = "restcountries.com v3.1 (fallback)";
        c.fallbackReason = err1.message; return c;
      }).catch(function (err2) {
        throw new Error("v5 call: " + err1.message + " | public v3.1 call: " + err2.message);
      });
    }).then(function (c) { cache[key] = c; return c; });
  }

  // Major cities from Wikidata, used only when the API record has none.
  function getCities(c) {
    if (c.cities.length) return Promise.resolve(c.cities.map(function (x) { return { name: x.name, pop: first(x.raw || {}, ["population"]) }; }));
    if (!c.code) return Promise.resolve([]);
    var sparql = 'SELECT ?l (MAX(?p) AS ?pop) WHERE { ?c wdt:P297 "' + c.code + '". VALUES ?t { wd:Q515 wd:Q1549591 } ' +
      '?x wdt:P31 ?t; wdt:P17 ?c; wdt:P1082 ?p; rdfs:label ?l. FILTER(LANG(?l)="en") } GROUP BY ?l ORDER BY DESC(?pop) LIMIT 8';
    return fetch("https://query.wikidata.org/sparql?format=json&query=" + encodeURIComponent(sparql))
      .then(function (r) { return r.json(); })
      .then(function (j) { return j.results.bindings.map(function (b) { return { name: b.l.value, pop: +b.pop.value }; }); })
      .catch(function () { return []; });
  }

  // ---- Tiles --------------------------------------------------------------
  var TILES = [
    ["capital", "Capital & cities"], ["population", "Population"], ["area", "Area"],
    ["currency", "Currency"], ["languages", "Languages"], ["flag", "Flag"], ["raw", "Raw API record"]
  ];
  function tileBody(id, c) {
    switch (id) {
      case "capital": return [c.capitals.map(function (x) { return x.name; }).join(", ") || "n/a", "Tap for major cities"];
      case "population": return [c.population != null ? fmt.format(c.population) : "n/a", c.region ? c.region + (c.subregion ? " · " + c.subregion : "") : ""];
      case "area": return [c.area != null ? fmt.format(c.area) + " km²" : "n/a", c.area != null ? fmt.format(Math.round(c.area * 0.386102)) + " sq mi" : ""];
      case "currency": return [c.currencies.map(function (x) { return (x.symbol ? x.symbol + " " : "") + x.name; }).join(", ") || "n/a", c.currencies.map(function (x) { return x.code; }).filter(Boolean).join(", ")];
      case "languages": return [c.languages.slice(0, 3).map(function (x) { return x.name; }).join(", ") || "n/a", c.languages.length > 3 ? "+" + (c.languages.length - 3) + " more" : ""];
      case "flag": return [c.flagUrl && /^https?:/.test(c.flagUrl) ? "" : (c.flagEmoji || "n/a"), ""];
      default: return ["View JSON", c.source];
    }
  }
  function renderTiles(c) {
    $("tiles").innerHTML = TILES.map(function (t) {
      var b = tileBody(t[0], c);
      var img = (t[0] === "flag" && c.flagUrl && /^https?:/.test(c.flagUrl)) ? '<img src="' + esc(c.flagUrl) + '" alt="Flag of ' + esc(c.name) + '">' : "";
      return '<button type="button" class="tile' + (t[0] === "flag" ? " flag" : "") + '" data-t="' + t[0] + '"><span class="k">' + t[1] +
        '</span>' + img + '<span class="big">' + esc(b[0]) + '</span><span class="sub">' + esc(b[1]) + '</span><span class="more">Details →</span></button>';
    }).join("");
  }

  function row(k, v) { return v == null || v === "" ? "" : "<tr><td>" + k + "</td><td>" + v + "</td></tr>"; }
  function openDetail(id) {
    var c = current; if (!c) return;
    var title = TILES.filter(function (t) { return t[0] === id; })[0][1] + " · " + c.name, html = "";
    var done = function () { $("dt").textContent = title; $("dbody").innerHTML = html; if (!$("dlg").open) $("dlg").showModal(); };
    if (id === "capital") {
      html = "<h3>Capital</h3><table>" + c.capitals.map(function (x) { return row("Capital", esc(x.name)); }).join("") +
        row("Coordinates", c.capitalLatLng ? c.capitalLatLng.join(", ") : "") + "</table><h3>Major cities</h3><p id=\"cities\">Loading…</p>";
      done();
      getCities(c).then(function (cs) {
        var el = $("cities"); if (!el) return;
        el.innerHTML = cs.length ? "<table>" + cs.map(function (x) { return row(esc(x.name), x.pop ? fmt.format(x.pop) : ""); }).join("") +
          "</table><p style='color:var(--muted);font-size:12px'>City list from the API when present, otherwise Wikidata.</p>" : "No city data available.";
      });
      return;
    }
    if (id === "population") {
      html = "<h3>People</h3><table>" + row("Population", c.population != null ? fmt.format(c.population) : "") +
        row("Density", c.population && c.area ? fmt.format(Math.round(c.population / c.area * 10) / 10) + " per km²" : "") +
        row("Region", esc(c.region)) + row("Subregion", esc(c.subregion)) + row("Independent", c.independent == null ? "" : c.independent ? "Yes" : "No") +
        row("UN member", c.unMember == null ? "" : c.unMember ? "Yes" : "No") + row("Timezones", esc(c.timezones.join(", "))) + "</table>";
    } else if (id === "area") {
      var ref = [["Texas", 695662], ["Ohio", 116098], ["the United Kingdom", 243610]];
      html = "<h3>Size</h3><table>" + row("Square kilometers", c.area != null ? fmt.format(c.area) : "") +
        row("Square miles", c.area != null ? fmt.format(Math.round(c.area * 0.386102)) : "") +
        row("Landlocked", c.landlocked == null ? "" : c.landlocked ? "Yes" : "No") +
        row("Borders", esc(c.borders.join(", ") || "None listed")) + "</table>";
      if (c.area != null) html += "<h3>For scale</h3>" + ref.map(function (r) {
        var x = c.area / r[1]; return "<p>" + (x >= 1 ? x.toFixed(1) + "× the size of " : Math.round(x * 100) + "% of the size of ") + r[0] + "</p>" +
          '<div class="bar"><i style="width:' + Math.min(100, x * 100) + '%"></i></div>'; }).join("");
    } else if (id === "currency") {
      html = "<h3>Currencies</h3><table>" + (c.currencies.map(function (x) { return row(esc(x.code || "Currency"), esc(x.name) + (x.symbol ? " (" + esc(x.symbol) + ")" : "")); }).join("") || row("Currency", "n/a")) + "</table>";
    } else if (id === "languages") {
      html = "<h3>Languages</h3><table>" + (c.languages.map(function (x) { return row(esc(x.code || ""), esc(x.name)); }).join("") || row("Languages", "n/a")) + "</table>" +
        "<h3>Also</h3><table>" + row("Calling code", esc(c.calling)) + row("Internet domain", esc(c.tld.join(", "))) + row("Drives on the", esc(c.drive)) + "</table>";
    } else if (id === "flag") {
      html = (c.flagUrl && /^https?:/.test(c.flagUrl) ? '<img class="flagbig" src="' + esc(c.flagUrl) + '" alt="Flag of ' + esc(c.name) + '">' : "<p>No flag image in the record.</p>") +
        (c.flagAlt ? "<p>" + esc(c.flagAlt) + "</p>" : "") +
        (c.coatUrl ? '<h3>Coat of arms</h3><img class="flagbig" style="max-width:180px" src="' + esc(c.coatUrl) + '" alt="Coat of arms of ' + esc(c.name) + '">' : "");
    } else {
      html = "<h3>Source</h3><p>" + esc(c.source) + (c.fallbackReason ? " · v5 call failed: " + esc(c.fallbackReason) : "") + "</p><h3>Record</h3><pre>" + esc(JSON.stringify(c.raw, null, 2)) + "</pre>";
    }
    done();
  }

  $("tiles").addEventListener("click", function (e) { var b = e.target.closest(".tile"); if (b) openDetail(b.dataset.t); });
  $("dx").addEventListener("click", function () { $("dlg").close(); });
  $("dlg").addEventListener("click", function (e) { if (e.target === $("dlg")) $("dlg").close(); });

  // ---- Selecting a country ----------------------------------------------
  function select(f) {
    selD = f; world.polygonsData(features);
    var cen = centroid(f); world.pointOfView({ lat: cen[1], lng: cen[0], altitude: 1.8 }, 900);
    setStatus("Loading " + f.properties.name + "…");
    $("tiles").innerHTML = '<div class="placeholder">Loading ' + esc(f.properties.name) + '…</div>';
    getCountry(f).then(function (c) {
      if (selD !== f) return;
      current = c; renderFacts(c); renderTiles(c);
      if (c.fallbackReason) setStatus("Showing " + c.name + " from the public v3.1 API (v5 call failed: " + c.fallbackReason + ")", true);
      else setStatus(c.name + " · " + c.source);
    }).catch(function (err) {
      $("tiles").innerHTML = '<div class="placeholder">Could not load ' + esc(f.properties.name) + ' (' + esc(err.message) + '). Check your connection.</div>';
      setStatus("Request failed", true);
    });
  }
  function centroid(f) {
    var pts = [], g = f.geometry;
    (function walk(a) { if (typeof a[0] === "number") pts.push(a); else a.forEach(walk); })(g.coordinates);
    var best = g.type === "MultiPolygon" ? g.coordinates.reduce(function (m, p) { return p[0].length > m[0].length ? p : m; }) : g.coordinates;
    pts = best[0];
    var x = 0, y = 0; pts.forEach(function (p) { x += p[0]; y += p[1]; });
    return [x / pts.length, y / pts.length];
  }

  // ---- Globe ---------------------------------------------------------------
  var wrap = $("globeWrap");
  fetch("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json").then(function (r) { return r.json(); }).then(function (topo) {
    features = topojson.feature(topo, topo.objects.countries).features.filter(function (f) { return f.properties.name !== "Antarctica"; });
    world = Globe()($("globe"))
      .width(wrap.clientWidth).height(wrap.clientHeight)
      .backgroundColor("rgba(0,0,0,0)")
      .globeImageUrl("https://cdn.jsdelivr.net/npm/three-globe@2.31.0/example/img/earth-blue-marble.jpg")
      .bumpImageUrl("https://cdn.jsdelivr.net/npm/three-globe@2.31.0/example/img/earth-topology.png")
      .atmosphereColor("#5ec2d6")
      .polygonsData(features)
      .polygonCapColor(function (d) { return d === selD ? "rgba(242,184,75,.75)" : d === hoverD ? "rgba(94,194,214,.55)" : "rgba(255,255,255,.04)"; })
      .polygonSideColor(function () { return "rgba(0,0,0,0)"; })
      .polygonStrokeColor(function () { return "rgba(255,255,255,.35)"; })
      .polygonAltitude(function (d) { return d === selD ? 0.03 : d === hoverD ? 0.015 : 0.005; })
      .polygonLabel(function (d) { return '<div style="background:#121a23;border:1px solid #263544;color:#e8eff5;padding:4px 8px;border-radius:6px">' + esc(d.properties.name) + "</div>"; })
      .onPolygonHover(function (d) { hoverD = d; world.polygonsData(features); wrap.style.cursor = d ? "pointer" : "grab"; })
      .onPolygonClick(function (d) { if (d) select(d); });
    world.controls().autoRotate = true; world.controls().autoRotateSpeed = 0.35;
    world.controls().addEventListener("start", function () { world.controls().autoRotate = false; });
    world.pointOfView({ lat: 30, lng: -40, altitude: 2.4 });
    setStatus("Ready. Click a country.");
    window.addEventListener("resize", function () { world.width(wrap.clientWidth).height(wrap.clientHeight); });
  }).catch(function () { setStatus("Could not load the globe data. Check your connection.", true); });

  // ---- Search box -----------------------------------------------------------
  var q = $("q"), ul = $("matches");
  q.addEventListener("input", function () {
    var s = q.value.trim().toLowerCase(); ul.innerHTML = "";
    if (!s) { ul.style.display = "none"; return; }
    var hits = features.filter(function (f) { return f.properties.name.toLowerCase().indexOf(s) > -1; }).slice(0, 8);
    ul.style.display = hits.length ? "block" : "none";
    hits.forEach(function (f) {
      var li = document.createElement("li"); li.textContent = f.properties.name; li.tabIndex = 0;
      var go = function () { ul.style.display = "none"; q.value = ""; select(f); };
      li.addEventListener("click", go); li.addEventListener("keydown", function (e) { if (e.key === "Enter") go(); });
      ul.appendChild(li);
    });
  });

  renderFacts(null);
  if (location.protocol === "file:") {
    setStatus("Opened as a file. Run server.py, then visit http://localhost:8000 instead.", true);
    $("tiles").innerHTML = '<div class="placeholder">This page was opened as a file, so it cannot reach the country data.<br>1. Put server.py next to this file and run: python server.py<br>2. Open http://localhost:8000 in your browser.</div>';
  }
})();
</script>
</body>
</html>
